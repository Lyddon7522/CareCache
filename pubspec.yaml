name: carecache
description: A private, local-first home medical supply and device companion from Vector42.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  drift: ^2.34.3
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_zxing: ^2.3.0
  go_router: ^17.4.0
  image_picker: ^1.2.3
  intl: 0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  image: ^4.9.2
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/tessdata/
