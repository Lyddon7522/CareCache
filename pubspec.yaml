name: carecache
description: A private, local-first home medical supply and device companion from Vector42.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.3.0
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  drift: ^2.35.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  # 2.4.0 breaks CocoaPods; 3.x changes persisted UPC barcode matching.
  flutter_zxing: 2.3.0
  go_router: ^18.0.1
  image_picker: ^1.2.3
  # Match the version required by flutter_localizations in Flutter 3.44.8.
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  image: ^4.10.1
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/tessdata/
