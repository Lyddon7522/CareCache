version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      flutter-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    # Astro's checker currently supports TypeScript 5 and 6.
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
    groups:
      astro-dependencies:
        patterns: ["*"]
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
