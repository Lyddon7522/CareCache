version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      flutter-dependencies:
        patterns: ["*"]
        # Review SDK-coupled and barcode-format upgrades in their own visible PRs.
        exclude-patterns: ["intl", "build_runner", "flutter_zxing"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      astro-dependencies:
        patterns: ["*"]
        # Keep compiler upgrades visible in separate PRs while Astro support catches up.
        exclude-patterns: ["typescript"]
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
