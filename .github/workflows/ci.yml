name: CareCache CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "infra/site/**"
      - ".github/workflows/site.yml"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "site/**"
      - "infra/site/**"
      - ".github/workflows/site.yml"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carecache-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  flutter:
    name: Generate, analyze, test, and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Reproduce generated code
        run: |
          flutter gen-l10n
          dart run build_runner build
          dart format lib/core/database/app_database.g.dart lib/l10n
          dart run tool/generate_icons.dart
          git diff --exit-code

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test --coverage

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload coverage
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v7
        with:
          name: carecache-coverage
          path: coverage/lcov.info
          retention-days: 14

  ios:
    name: Build iOS simulator
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Build unsigned iOS simulator app
        run: flutter build ios --simulator --debug --no-codesign
